<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Blast Puzzle Premium</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        body {
            background: radial-gradient(circle, #1e1b4b 0%, #0f0726 100%) !important;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .game-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(139, 92, 246, 0.2);
            text-align: center;
        }
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
            width: 400px; 
        }
        h1 { 
            font-size: 28px; 
            font-weight: 800; 
            background: linear-gradient(to right, #a78bfa, #f472b6); 
            background-clip: text;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            text-shadow: 0 0 20px rgba(167, 139, 250, 0.4); 
        }
        .score-box { 
            background: rgba(0,0,0,0.4); 
            padding: 8px 20px; 
            border-radius: 12px; 
            border: 1px solid #3b2e56; 
            font-size: 18px; 
            font-weight: bold; 
            color: #34d399; 
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.5); 
        }
        canvas {
            background: #0d0621;
            border-radius: 16px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 15px rgba(139, 92, 246, 0.1);
            cursor: grab;
            display: block;
        }
        canvas:active { 
            cursor: grabbing; 
        }
        .instructions { 
            margin-top: 15px; 
            font-size: 13px; 
            color: #94a3b8; 
            letter-spacing: 0.5px; 
        }
        .game-over-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 7, 38, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }
        .game-over-overlay h2 {
            font-size: 36px;
            font-weight: 900;
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            margin-bottom: 10px;
        }
        .final-score-text {
            font-size: 48px;
            font-weight: bold;
            color: #34d399;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
        }
        .restart-btn {
            background: linear-gradient(to right, #8b5cf6, #ec4899);
            border: none;
            color: white;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.5);
            transition: transform 0.2s;
        }
        .restart-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>NEON BLAST</h1>
        <div class="score-box">SCORE: <span id="score">0</span></div>
    </div>
    
    <div style="position: relative; display: inline-block;">
        <canvas id="gameCanvas" width="400" height="580"></canvas>
        <div id="gameOverScreen" class="game-over-overlay">
            <h2>GAME OVER</h2>
            <p>Skor Akhir Kamu:</p>
            <div id="finalScore" class="final-score-text">0</div>
            <button onclick="resetGame()" class="restart-btn">MAIN LAGI</button>
        </div>
    </div>
    
    <div class="instructions">SERET BALOK NEON KE DALAM PAPAN GRID</div>
</div>

<script src="game.js"></script>
</body>
</html>
